name: Build Dex

on:
  push:
    branches: [ main, master ]
    paths:
      - 'dex/**'
      - '.github/workflows/build-dex.yaml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'dex/**'
  workflow_dispatch:

jobs:
  build:
    name: "Build Dex Module"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dex

    permissions:
      contents: write

    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Validate gradle wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup gradle
        uses: gradle/gradle-build-action@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build dex APK
        run: ./gradlew assembleRelease --parallel

      - name: Extract classes.dex from APK
        run: |
          mkdir -p ../artifacts-dex
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -n "$APK_PATH" ]; then
            unzip -o "$APK_PATH" classes.dex -d ../artifacts-dex/
            echo "Extracted classes.dex from $APK_PATH"
          else
            echo "No APK found"
            exit 1
          fi

      - name: Upload dex artifact
        uses: actions/upload-artifact@v4
        with:
          name: classes-dex
          path: 'artifacts-dex/classes.dex'
          retention-days: 30
